name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for this build (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test the converter
        run: |
          npx tsc --noEmit
          npx tsx --test tests/conversions.test.ts

      - name: Build the web application
        run: npm run build

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Regenerate Gradle wrapper (gradle-wrapper.jar is missing from the repo)
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --no-daemon

      - name: Write version numbers
        working-directory: android
        run: |
          VERSION="${VERSION_NAME#v}"
          CODE="$(date -u +%Y%m%d%H)"
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" app/build.gradle
          sed -i "s/versionCode 1/versionCode $CODE/" app/build.gradle
          echo "Building $VERSION with versionCode $CODE"

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/ashcrypt-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../ashcrypt-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release keystore restored"

      - name: Warn when signing secrets are missing
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::KEYSTORE_BASE64 secret is not set. The APK will be unsigned and Play Store upload will be impossible. Add the four keystore secrets to this repository."

      - name: Build APK and Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Name the artifacts
        run: |
          VERSION="${VERSION_NAME#v}"
          mkdir -p artifacts
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -s "$APK" ]; then
            if [ -s "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              echo "::error::Only an unsigned APK was produced. Set the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository secrets."
              exit 1
            fi
            echo "::error::No release APK was produced."
            exit 1
          fi
          cp "$APK" "artifacts/AshCrypt-${VERSION}.apk"
          [ -s "$AAB" ] && cp "$AAB" "artifacts/AshCrypt-${VERSION}.aab"
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ashcrypt-android-${{ env.VERSION_NAME }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
